<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IESC Fee Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 200px;
            height: 160px;
            object-fit: contain;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            margin: -5px 0 5px 0;
            color: #172554;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu a {
            display: block;
            padding: 17px;
            text-decoration: none;
            background: #172554;
            color: white;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.25s;
        }

        .menu a:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

    </style>

</head>

<body>

    <div class="container">

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            alt="Irshad Educational Academy Logo"
            class="logo"
        >

        

        <div class="subtitle">
            Student Information/Fee Management
        </div>

        <div class="menu">

            <a href="/admin-login">
                Admin
            </a>

             <a href="/staff-login">
                Staff
            </a>

        </div>

        <div class="footer">
            Irshad Educational Academy
            <br>
            Academic Session 2026–2027
        </div>

    </div>

</body>

</html>
