<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Challan Options | IESC Fee Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            min-height: 100vh;
            padding: 35px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 150px;
            height: 95px;
            object-fit: contain;
            display: block;
            margin: 0 auto 5px auto;
        }

        h1 {
            margin: 0;
            color: #172554;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-top: 7px;
            font-size: 14px;
        }

        h2 {
            color: #172554;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .description {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #172554;
        }

        input[readonly] {
            background: #f8fafc;
            color: #333;
        }

        .amount {
            font-weight: bold;
        }

        .due-date-box {
            background: #f8fafc;
            color: #172554;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button, .back-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.25s;
        }

        .generate {
            background: #16a34a;
            color: white;
        }

        .generate:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .back-btn {
            background: #e0e7ff;
            color: #172554;
        }

        .back-btn:hover {
            background: #c7d2fe;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 650px) {
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="IESC Logo" class="logo">
            <div class="subtitle">Fee Management System</div>
        </div>

        <h2>Generate All Student Challans</h2>
        <div class="description">
            Customize additional fee charges below. These charges will be applied to all student challans along with their respective monthly tuition fees.
        </div>

        <form method="POST" action="/students/generate-all">

            <div class="row">
                <div class="form-group">
                    <label>Challan Issue Date</label>
                    <input type="date" name="fee_date" id="fee_date" value="{{ default_date }}" required>
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" name="due_date" id="due_date" value="" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Admission / Additional Fee (Rs.)</label>
                    <input type="number" name="other_fee" class="amount" min="0" step="1" value="0">
                </div>

                <div class="form-group">
                    <label>Annual Fee (Rs.)</label>
                    <input type="number" name="annual_fee" class="amount" min="0" step="1" value="0">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Stationery / Exam Fee (Rs.)</label>
                    <input type="number" name="stationery_fee" class="amount" min="0" step="1" value="0">
                </div>

                <div class="form-group">
                    <label>Late Fee (Rs.)</label>
                    <input type="number" name="late_fee" class="amount" min="0" step="1" value="0">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Discount (Rs.)</label>
                    <input type="number" name="discount" class="amount" min="0" step="1" value="0">
                </div>
            </div>

            <div class="buttons">
                <a href="{% if session.get('admin_logged_in') %}/admin{% else %}/generate-challan{% endif %}" class="back-btn">
                    Cancel
                </a>

                <button type="submit" class="generate">
                    Generate All Challans Now
                </button>
            </div>

        </form>

        <div class="footer">
            Irshad Educational Academy<br>
            Academic Session 2026–2027
        </div>

    </div>

    <script>
        function calculateDueDate() {
            const feeDateInput = document.getElementById("fee_date");
            const dueDateInput = document.getElementById("due_date");

            if (!feeDateInput.value) return;

            const feeDate = new Date(feeDateInput.value + "T00:00:00");
            feeDate.setDate(feeDate.getDate() + 10);

            const year = feeDate.getFullYear();
            const month = String(feeDate.getMonth() + 1).padStart(2, "0");
            const day = String(feeDate.getDate()).padStart(2, "0");

            dueDateInput.value = `${year}-${month}-${day}`;
        }

        document.getElementById("fee_date").addEventListener("change", calculateDueDate);
        calculateDueDate();
    </script>

</body>

</html>
