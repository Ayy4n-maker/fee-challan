<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | IESC</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 16px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.15);

    text-align: center;
}

.logo {
    width: 150px;
    height: 100px;
    object-fit: contain;
}

h1 {
    color: #172554;
    font-size: 25px;
    margin: 10px 0 5px;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;

    border: 1px solid #cbd5e1;
    border-radius: 7px;

    font-size: 14px;
}

.login-button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 7px;

    background: #172554;
    color: white;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.login-button:hover {
    background: #2563eb;
}

.error {
    background: #fee2e2;
    color: #991b1b;

    padding: 10px;
    border-radius: 6px;

    font-size: 12px;
    margin-bottom: 15px;
}

.success {
    background: #dcfce7;
    color: #166534;

    padding: 10px;
    border-radius: 6px;

    font-size: 12px;
    margin-bottom: 15px;
    border-left: 4px solid #16a34a;
}

.register-section {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #e2e8f0;
    font-size: 13px;
    color: #475569;
}

.register-section a {
    color: #2563eb;
    font-weight: bold;
    text-decoration: none;
}

.register-section a:hover {
    text-decoration: underline;
}

.back {
    display: block;
    margin-top: 15px;

    color: #64748b;
    text-decoration: none;

    font-size: 12px;
}

</style>

</head>

<body>

<div class="login-box">

    <img
        src="{{ url_for('static', filename='logo.png') }}"
        class="logo"
        alt="IESC Logo"
    >

    <h1>Admin Login</h1>

    <div class="subtitle">
        IESC Fee Management System
    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            class="input"
            placeholder="Admin Username"
            required
            autofocus
        >

        <input
            type="password"
            name="password"
            class="input"
            placeholder="Admin Password"
            required
        >

        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>

    <div class="register-section">
        Need a new school portfolio?<br>
        <a href="/register">+ Create New Admin & Portfolio</a>
    </div>

    <a
        href="/"
        class="back"
    >
        ← Back to Main Page
    </a>

</div>

</body>

</html>
